import * as THREE from 'three';

// stars
{ const n = 420, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { p[i * 3] = (h2(i, 1) - .5) * 220; p[i * 3 + 1] = 14 + h2(i, 2) ** .7 * 95; p[i * 3 + 2] = -125; }

  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: K.ice, size: 2.2, sizeAttenuation: false, fog: false, transparent: true, opacity: .75 }))); }

      vec3 col = mix(low, mid, smoothstep(-.9, .1, p.y)); col = mix(col, top, smoothstep(.1, .85, p.y));

const glowC = mk(256, 256), gx = glowC.getContext('2d'), gg = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
gg.addColorStop(0, 'rgba(255,90,140,.55)'); gg.addColorStop(.45, 'rgba(255,46,136,.18)'); gg.addColorStop(1, 'rgba(255,46,136,0)'); gx.fillStyle = gg; gx.fillRect(0, 0, 256, 256);

// mountains: dark ridges on either side of the sun with neon edges
const mountains = new THREE.Group(); scene.add(mountains);

ridge(-112, 15, 3, '#7a2a8a', '#0d0619', .7); ridge(-100, 10, 9, K.pink, '#100620', .85);

// the ground: one shader draws the neon grid, the road edges and the centre dashes, scrolling with D(t)
const groundMat = new THREE.ShaderMaterial({ fog: false, extensions: {},
  uniforms: { uOff: { value: 0 }, uFog: { value: C(K.fog) }, uGain: { value: 1 } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `varying vec3 vW; uniform float uOff; uniform vec3 uFog; uniform float uGain;
    float aline(float v, float w){ float d = abs(v); float f = fwidth(v); return 1. - smoothstep(w, w + f * 1.5, d); }
    void main(){ float dist = -vW.z; float x = vW.x, z = vW.z - uOff;

      float road = step(abs(x), 2.6);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 125), groundMat); ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -57.5); scene.add(ground);
const horizon = new THREE.Mesh(new THREE.PlaneGeometry(400, .35), new THREE.MeshBasicMaterial({ color: C('#ff6aa8'), fog: false, transparent: true, opacity: .8 }));
horizon.position.set(0, .05, -119.5); scene.add(horizon);

// the eight lamps: posts that alternate sides, each with a head and a pool of light on the road
const poolC = mk(128, 128), px = poolC.getContext('2d'), pg = px.createRadialGradient(64, 64, 0, 64, 64, 64);

const LAMPS = [];
for (let i = 0; i < 8; i++) {
  const side = i % 2 ? 1 : -1, g = new THREE.Group(); g.position.x = side * 3.6;
  const post = new THREE.Mesh(new THREE.BoxGeometry(.12, 4.2, .12), new THREE.MeshBasicMaterial({ color: '#2a1840' })); post.position.y = 2.1; g.add(post);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.3, .08, .08), new THREE.MeshBasicMaterial({ color: '#2a1840' })); arm.position.set(-side * .62, 4.15, 0); g.add(arm);
  const head = new THREE.Mesh(new THREE.BoxGeometry(.7, .1, .22), new THREE.MeshBasicMaterial({ color: C('#3a2350') })); head.position.set(-side * 1.15, 4.06, 0); g.add(head);

  pool.rotation.x = -Math.PI / 2; pool.position.set(-side * 1.15, .03, 0); g.add(pool);
  scene.add(g); LAMPS.push({ g, head, pool, t: 5 + i * .25, z0: -(12 + 7 * i) });
}

// three exits: overhead gantries that read clearly at the countdown cues
const SIGNS = [['EXIT 03', 'CLARITY', 13.5], ['EXIT 02', 'FOCUS', 14.5], ['EXIT 01', 'MOMENTUM', 15.5]].map(([small, big, t]) => {
  const c = mk(1024, 300), x = c.getContext('2d'); const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ map: null, transparent: true, fog: false, opacity: 0 });
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 1.875), mat); panel.position.y = 3.5; g.add(panel);
  const beamMat = new THREE.MeshBasicMaterial({ color: '#2a1840', transparent: true, opacity: 0 });
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(.16, 4.5, .16), beamMat); p.position.set(s * 4.4, 2.25, 0); g.add(p); }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(9, .14, .14), beamMat); beam.position.y = 4.5; g.add(beam);
  scene.add(g); return { small, big, t, c, x, mat, beamMat, g };
});
function drawSigns() { for (const s of SIGNS) { const x = s.x; x.fillStyle = '#0c0824'; x.fillRect(0, 0, 1024, 300);
  x.strokeStyle = K.pink; x.lineWidth = 12; x.strokeRect(14, 14, 996, 272); x.strokeStyle = rgba(K.pink, .35); x.lineWidth = 4; x.strokeRect(34, 34, 956, 232);
  x.fillStyle = K.lilac; x.font = "40px 'ShareTech'"; x.textAlign = 'center'; x.fillText(s.small + '  ↗', 512, 98);
  x.fillStyle = K.ice; const sz = fitSize(x, s.big, "900 SZpx 'Orbitron'", 860, 116, 0); x.font = `900 ${sz}px 'Orbitron'`; x.fillText(s.big, 512, 230);
  s.mat.map = texFrom(s.c); s.mat.needsUpdate = true; } }

const m4 = new THREE.Matrix4();

const horizonY = { v: H * .62 };

  const climb = E.outCubic(prog(t, 8.0, 10.8)), push = E.inOutCubic(prog(t, 13, 15.4)), rest = E.inOutCubic(prog(t, 15.6, 16.2));
  markRoot.position.set(0, lerp(-5.5, 10.2, climb) + push * .6 - rest * .3, lerp(-36, -31, push));
  markRoot.scale.setScalar(4.2);
  backing.material.opacity = climb * .9;
  frame.scale.setScalar(back(lt / .55)); ring.scale.setScalar(back((lt - .35) / .5));
  const unfold = E.outCubic(prog(lt, .7, 1.6));
  const ang = (t - 8) * .6 * (1 - rest), P = project(ang, ang * .37);
  for (let k = 0; k < E4.length; k++) { const [i, j] = E4[k]; tessPos.set([...P[i].map(v => v * unfold), ...P[j].map(v => v * unfold)], k * 6); }
  tessGeo.setPositions(tessPos);
  P.forEach((p, i) => { m4.makeTranslation(p[0] * unfold, p[1] * unfold, p[2] * unfold); nodes.setMatrixAt(i, m4); }); nodes.instanceMatrix.needsUpdate = true;
  let pulse = 1; for (let b = 9.5; b < DUR; b += .5) { const d = t - b; if (d >= 0 && d < .4) pulse += .3 * Math.exp(-d * 9); }
  core.scale.setScalar((.2 + 1.4 * E.outCubic(prog(lt, 1.35, 1.75))) * pulse);
  mark.rotation.set(Math.sin(t * .5) * .12 * (1 - rest), Math.sin(t * .7) * .45 * (1 - rest), 0);
  // the breath before GO: the world dims for half a second, then opens on the lockup
  const breath = smooth(prog(t, 15.45, 15.75)) * (1 - smooth(prog(t, 15.9, 16.1)));
  const gain = 1 - .45 * breath; groundMat.uniforms.uGain.value = gain; sunMat.uniforms.uGain.value = gain * .5;
  bloom.strength = (.8 + .25 * Math.exp(-Math.max(0, t - 16) * 2) * (t > 16 ? 1 : 0)) * (1 - .4 * breath);
  composer.render();
}

/* =====================================================================
   2D: type, HUD, finishing
   ===================================================================== */
const main = document.getElementById('c'), ctx = main.getContext('2d');
const tmp = mk(), tctx = tmp.getContext('2d');

// 80s chrome: ice to blue above a hard horizon line, pink below, with a soft neon glow
function chrome(c, str, shown, x, y, size, spacing = 0, glowA = 1) {
  c.font = `900 ${size}px 'Orbitron'`;
  const g = c.createLinearGradient(0, y - size * .82, 0, y + size * .05);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.45, '#bcd0ff'); g.addColorStop(.52, '#2f5bff'); g.addColorStop(.53, '#1a1240'); g.addColorStop(.7, '#ff2e88'); g.addColorStop(1, '#ffd1e6');
  c.shadowColor = rgba(K.pink, .8 * glowA); c.shadowBlur = 30; c.fillStyle = g; slotText(c, str, shown, x, y, spacing); c.shadowBlur = 0;
}
function headline(t) {
  const lines = [
    { a: 'BUILDING IS', b: 'A NIGHT DRIVE.', sub: 'No map. No streetlights. Nobody to call.', t0: 1.6, t1: 4.85 },
    { a: 'YOU NEED', b: 'A SYSTEM.', sub: 'Light the road ahead.', t0: 5.0, t1: 7.6 },
  ];
  for (const [k, L] of lines.entries()) {
    if (t < L.t0 || t > L.t1 + .3) continue;
    const out = 1 - E.inCubic(prog(t, L.t1, L.t1 + .3)), lift = (1 - out) * -30;
    ctx.globalAlpha = out;
    const s1 = fitSize(ctx, L.b, "900 SZpx 'Orbitron'", 940, 104, 6);
    chrome(ctx, L.a, decode(L.a, t, L.t0, { seed: 10 + k, stagger: .035 }), W / 2, 430 + lift, s1, 6);
    chrome(ctx, L.b, decode(L.b, t, L.t0 + .25, { seed: 20 + k, stagger: .035 }), W / 2, 430 + s1 * 1.12 + lift, s1, 6);
    ctx.font = "34px 'Oxanium'"; ctx.fillStyle = K.lilac; ctx.shadowColor = rgba(K.void, .9); ctx.shadowBlur = 12;
    slotText(ctx, L.sub, decode(L.sub, t, L.t0 + .7, { seed: 30 + k, stagger: .015 }), W / 2, 430 + s1 * 2.1 + 20 + lift, 1); ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}
function hud(t) {
  if (t < .45) return;
  const a = E.outCubic(prog(t, .45, .9)) * (1 - prog(t, 19.3, 19.5));
  ctx.globalAlpha = a; ctx.font = "30px 'ShareTech'"; ctx.fillStyle = K.lilac;
  const L = 'TX-01 · NIGHT DRIVE'; ctx.textAlign = 'left'; ctx.fillText(decode(L, t, .45, { seed: 3, stagger: .02 }), 60, 110);
  const odo = 'ODO ' + (Dist(t) * .06 + 1984).toFixed(1).padStart(7, '0') + ' MI'; ctx.textAlign = 'right'; ctx.fillText(t < .7 ? '' : odo, W - 60, 110); ctx.textAlign = 'left';
  ctx.fillStyle = rgba(K.lilac, .35); ctx.fillRect(60, 132, W - 120, 2);
  // signal locked
  if (t >= 7.5 && t < 8.6) { const f = 1 - prog(t, 8.2, 8.6); ctx.globalAlpha = a * f; ctx.font = "44px 'ShareTech'"; ctx.fillStyle = K.ice; ctx.shadowColor = K.pink; ctx.shadowBlur = 18;
    slotText(ctx, 'SIGNAL LOCKED', decode('SIGNAL LOCKED', t, 7.5, { seed: 40, stagger: .02 }), W / 2, horizonY.v - 150, 4); ctx.shadowBlur = 0; }
  // readouts resolve as the mark settles (same three as TX-02)
  if (t >= 10 && t < 15.8) { const f = 1 - prog(t, 15.4, 15.8); ctx.globalAlpha = a * f; ctx.font = "32px 'ShareTech'"; ctx.fillStyle = K.lilac;
    [['RUNWAY', '14.2 MO', 10.0], ['FOCUS', '3 PRIORITIES', 10.4], ['SIGNAL', '0.82', 10.8]].forEach(([k, v, t0], i) => ctx.fillText(decode(`${k}  ${v}`, t, t0, { stagger: .025, seed: 50 + i }), 60, H - 170 + i * 40)); }
  ctx.globalAlpha = 1;
}
function lockup(t) {
  if (t < 15.95) return;
  const a = 1 - prog(t, 19.3, 19.45);
  const band = ctx.createLinearGradient(0, 1180, 0, 1720); band.addColorStop(0, 'rgba(11,6,18,0)'); band.addColorStop(.35, 'rgba(11,6,18,.6)'); band.addColorStop(.7, 'rgba(11,6,18,.6)'); band.addColorStop(1, 'rgba(11,6,18,0)');
  ctx.globalAlpha = E.outCubic(prog(t, 15.95, 16.4)) * a; ctx.fillStyle = band; ctx.fillRect(0, 1180, W, 540);
  ctx.globalAlpha = a;
  const word = 'darkwinter.ai', sz = fitSize(ctx, word, "900 SZpx 'Orbitron'", 940, 118, 4);
  chrome(ctx, word, decode(word, t, 16.0, { seed: 60, stagger: .04, dur: .25 }), W / 2, 1440, sz, 4, 1 + .6 * Math.exp(-Math.max(0, t - 16) * 2));
  const tag = 'INTELLIGENCE FOR UNCERTAIN TIMES'; ctx.font = "36px 'Oxanium'"; ctx.fillStyle = K.ice; ctx.shadowColor = K.pink; ctx.shadowBlur = 14;
  slotText(ctx, tag, decode(tag, t, 16.45, { seed: 61, stagger: .018 }), W / 2, 1515, 5); ctx.shadowBlur = 0;
  const lw = 520 * E.outExpo(prog(t, 16.3, 17)); ctx.fillStyle = K.pink; ctx.fillRect(W / 2 - lw / 2, 1468, lw, 3);
  ctx.globalAlpha = 1;
}

let GRAIN = [], SCAN;
function initFinish() { for (let g = 0; g < 6; g++) { const c = mk(256, 256), x = c.getContext('2d'), id = x.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = h2(i, g + 31) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); GRAIN.push(ctx.createPattern(c, 'repeat')); }
  const s = mk(4, 4), sx2 = s.getContext('2d'); sx2.fillStyle = 'rgba(0,0,0,.22)'; sx2.fillRect(0, 2, 4, 2); SCAN = ctx.createPattern(s, 'repeat'); }

function renderFrame(f) {
  const t = f / FPS;
  render3D(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const [sx_, sy_] = sway(t); ctx.translate(sx_, sy_);
  // power on: a pink horizon line draws out from the centre, then the world fades up through it
  const up = E.inOutCubic(prog(t, .85, 1.9));
  ctx.imageSmoothingQuality = 'high'; ctx.globalAlpha = up; ctx.drawImage(gl, -20, -20, W + 40, H + 40); ctx.globalAlpha = 1;
  if (t < 2.2) { const lw = W * E.outExpo(prog(t, .2, .95)), la = 1 - prog(t, 1.3, 2.2); ctx.globalAlpha = la; ctx.fillStyle = '#ff6aa8'; ctx.shadowColor = K.pink; ctx.shadowBlur = 30;
    ctx.fillRect(W / 2 - lw / 2, horizonY.v - 2, lw, 4); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
  headline(t); hud(t); lockup(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // finishing: scanlines, grain, vignette
  ctx.globalAlpha = .5; ctx.fillStyle = SCAN; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .08; ctx.fillStyle = GRAIN[f % 6];
  ctx.save(); ctx.translate((f * 53) % 256, (f * 97) % 256); ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .72); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // end: the picture folds to a line and then a dot, with the tape stop
  if (t > 19.35) { tctx.clearRect(0, 0, W, H); tctx.drawImage(main, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const syk = Math.max(.003, 1 - E.inCubic(prog(t, 19.35, 19.7))), sxk = Math.max(.002, 1 - E.inExpo(prog(t, 19.66, 19.95)));
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(sxk, syk); ctx.drawImage(tmp, -W / 2, -H / 2); ctx.restore();
    const la = prog(t, 19.55, 19.7) * (1 - prog(t, 19.9, 19.98)); ctx.globalAlpha = la; ctx.fillStyle = '#ffd1e6'; ctx.shadowColor = K.pink; ctx.shadowBlur = 40;
    ctx.fillRect(W / 2 - W * sxk / 2, H / 2 - 2, W * sxk, 4); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
}

window.ready = (async () => {
  await Promise.all(["900 40px 'Orbitron'", "30px 'Oxanium'", "30px 'ShareTech'"].map(f => document.fonts.load(f)));
  drawSigns(); initFinish(); return true;
})();
window.renderFrame = renderFrame;
if (!location.search.includes('render')) window.ready.then(() => { const t0 = performance.now(); const loop = () => { renderFrame(Math.floor(((performance.now() - t0) / 1000 % DUR) * FPS)); requestAnimationFrame(loop); }; loop(); });
</script>
</body>
